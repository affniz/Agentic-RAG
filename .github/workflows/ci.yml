name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # the version requirements.lock was made with
          cache: pip
          cache-dependency-path: requirements*
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements-dev.txt -c requirements.lock  # same versions as the Docker image
      - run: python -m pytest -q

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build  # tsc -b && vite build

  docker:
    name: Docker image
    needs: [tests, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60  # the arm64 image is built under QEMU on pushes to main
    permissions:
      contents: read
      packages: write  # push to ghcr.io on main only
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agentic-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (demo mode, no API key)
        run: scripts/docker_smoke_test.sh agentic-rag:ci

      - name: Image name (GHCR needs lowercase)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Log in to GHCR
        if: steps.meta.outcome == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One tag for both architectures, so `docker pull` works on Apple Silicon and ARM servers.
      # arm64 is emulated (QEMU): slower, so it runs only here, not on pull requests.
      - name: Set up QEMU (arm64)
        if: steps.meta.outcome == 'success'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Push to GHCR (linux/amd64 + linux/arm64)
        if: steps.meta.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch
